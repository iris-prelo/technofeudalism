<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web as Territory</title>
  <link rel="stylesheet" href="style.css?v=pi-buttons-3" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
  <script src="https://unpkg.com/comlink/dist/umd/comlink.js"></script>
  <script src="main.js?v=pi-buttons-3" defer></script>
</head>

<body>
  <div id="wiki-preload" class="wiki-preload" role="status" aria-live="polite">
    <div>
      <p id="wiki-preload-status">Loading Wikipedia articles ...</p>
      <button id="wiki-preload-retry" type="button" hidden>Retry</button>
    </div>
  </div>
  <div class="circle" data-mode="public">
    <canvas id="map-canvas" class="map-canvas" aria-hidden="true"></canvas>
    <canvas id="tag-debug-canvas" aria-label="AprilTag map locations"></canvas>
    <div id="tracking-layer" aria-hidden="true"></div>
    <section class="experience" aria-live="polite">
      <article class="wiki-panel" hidden>
        <img class="mask" src="assets/mask_public_area.svg" alt="" aria-hidden="true" />
        <iframe class="wiki-frame" title="Wikipedia article" sandbox="allow-same-origin" tabindex="-1"></iframe>
        <div class="wiki-loading" role="status">
          Loading Wikipedia article ...
        </div>
        <a class="wiki-original" target="_blank" rel="noopener noreferrer" aria-label="Open article on Wikipedia">↗</a>
      </article>
      <div class="private-layer"></div>
    </section>
    <div class="private-reveal" aria-hidden="true"></div>
    <div class="info">
      <img src="assets/infobox.svg" alt="" class="info-box" />
      <div class="info-data">
        <p class="info-location">720 x 450</p>
        <p class="info-visitors">-</p>
        <p class="info-type">no data</p>
        <p class="info-adress"></p>
      </div>
    </div>
    <div class="compass-pointer"></div>
    <img src="assets/location.svg" alt="Location on the map" class="location-icon" />
    <img src="assets/vertical.svg" alt="" class="vertical-line" />
    <img src="assets/horizontal.svg" alt="" class="horizontal-line" />
    <div class="compass-container">
      <div class="direction north">
        <p class="direction-text">N</p>
      </div>
      <div class="direction south">
        <p class="direction-text">S</p>
      </div>
      <div class="direction east">
        <p class="direction-text">E</p>
      </div>
      <div class="direction west">
        <p class="direction-text">W</p>
      </div>
    </div>
  </div>
  <div id="camera-view" style="opacity:0!important;pointer-events:none!important">
    <video id="video" autoplay playsinline muted></video><canvas id="camera-overlay"
      aria-label="AprilTag detection debug overlay"></canvas>
  </div>
  <label id="camera-control" for="camera-select" style="opacity:0!important;pointer-events:none!important">Camera
    <select id="camera-select" disabled>
      <option>Requesting camera access ...</option>
    </select></label>
  <div id="status" role="status" style="opacity:0!important;pointer-events:none!important">Starting ...</div>
</body>

</html>
