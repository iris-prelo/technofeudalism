<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Territorien des Webs</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body>
    <div class="circle">
        <canvas id="map-canvas" class="map-canvas" aria-hidden="true"></canvas>

        <div class="info">
            <img src="assets/infobox.svg" alt="" class="info-box">
            <div class="info-data">
                <p class="info-location">720 × 450</p>
                <p class="info-visitors">—</p>
                <p class="info-type">no data</p>
                <p class="info-adress"></p>
            </div>
        </div>
        <div class="compass-pointer"></div>
        <img src="assets/location.svg" alt="Standort auf der Karte" class="location-icon">
        <img src="assets/vertical.svg" alt="" class="vertical-line">
        <img src="assets/horizontal.svg" alt="" class="horizontal-line">

        <div class="compass-container">
            <div class="direction north">
                <p class="direction-text">N</p>
            </div>
            <div class="direction south">
                <p class="direction-text">S</p>
            </div>
            <div class="direction east">
                <p class="direction-text">E</p>
            </div>
            <div class="direction west">
                <p class="direction-text">W</p>
            </div>
        </div>
    </div>
</body>

</html>
