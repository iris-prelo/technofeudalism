<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fa">
    <link rel="icon" href="data:,">
    <title>Public Paths – Wikipedia-Kreise</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: #f7f8fa;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Die Zeichenfläche behält exakt das Seitenverhältnis der Originalskizze. */
        .viewport {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            overflow: auto;
            background: #f7f8fa;
        }

        .map {
            position: relative;
            flex: none;
            width: max(960px, min(100vw, 1498px));
            aspect-ratio: 1498 / 927;
            margin: auto;
            isolation: isolate;
        }

        #guides {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
        }

        #dots {
            position: absolute;
            inset: 0;
        }

        /* Die grauen Kreise bilden die Wege; die SVG-Linien selbst sind unsichtbar. */
        .article-dot {
            position: absolute;
            display: block;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: rgba(220, 223, 227, var(--alpha));
            box-shadow: 0 0 7px 2px rgba(220, 223, 227, .42);
            filter: blur(1.4px);
            transform: translate(-50%, -50%);
            transition: opacity .16s ease;
            cursor: pointer;
        }

        .article-dot.is-active {
            opacity: 0;
        }

        .article-dot:focus-visible {
            outline: 3px solid #59606b;
            outline-offset: 4px;
            filter: none;
        }

        /* Die Vorschau liegt genau über dem gewählten Kreis und wächst um dessen Mitte. */
        .preview {
            position: absolute;
            width: clamp(250px, 25vw, 334px);
            aspect-ratio: 1;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(var(--start-scale, .1));
            transform-origin: center;
            transition: transform .32s cubic-bezier(.17, .78, .25, 1), opacity .16s ease;
        }

        .preview.is-visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Die Unschärfe betrifft nur den Rand, niemals den lesbaren Artikeltext. */
        .preview::before {
            content: "";
            position: absolute;
            inset: -7px;
            border-radius: 50%;
            background: #d8dce1;
            filter: blur(8px);
            opacity: .9;
        }

        .preview-surface {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border-radius: 50%;
            background: #fff;
            box-shadow: inset 0 0 14px rgba(180, 183, 189, .24);
        }

        .wiki-page {
            padding: 38px 34px 28px;
            color: #202122;
            opacity: 0;
            transition: opacity .18s ease .08s;
        }

        .preview.is-visible .wiki-page {
            opacity: 1;
        }

        .wiki-masthead {
            display: flex;
            align-items: center;
            gap: 7px;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 10px;
            letter-spacing: .15em;
            color: #54595d;
            text-transform: uppercase;
        }

        .wiki-mark {
            font-size: 27px;
            line-height: .9;
            letter-spacing: -.12em;
        }

        .wiki-page h1 {
            margin: 12px 0 3px;
            font: normal 24px/1.08 Georgia, 'Times New Roman', serif;
            overflow-wrap: anywhere;
        }

        .wiki-rule {
            height: 1px;
            background: #a2a9b1;
            margin: 8px 0 10px;
        }

        .wiki-subtitle {
            margin: 0 0 9px;
            font-size: 10px;
            color: #54595d;
        }

        .wiki-excerpt {
            font: 12px/1.43 Arial, Helvetica, sans-serif;
            margin: 0;
            max-height: 180px;
            overflow: hidden;
            white-space: pre-line;
            overflow-wrap: anywhere;
        }

        .wiki-image {
            display: none;
            float: right;
            width: 81px;
            max-height: 96px;
            object-fit: cover;
            margin: 1px 0 7px 9px;
            border: 1px solid #eaecf0;
        }

        .wiki-image.has-image {
            display: block;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (prefers-reduced-motion: reduce) {

            .preview,
            .wiki-page,
            .article-dot {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <p class="sr-only">Graue Kreise markieren Wikipedia-Artikel auf den öffentlichen Wegen. Mit der Maus darüberfahren
        oder per Tab auswählen. Ein Klick öffnet den Artikel. Auf Touchscreens erst antippen, dann erneut tippen.</p>
    <div class="viewport" id="viewport">
        <main class="map" id="map" aria-label="Wikipedia auf öffentlichen Wegen">
            <!-- Originale Pfadgeometrie. Keine Striche und keine schwarze Füllfläche anzeigen. -->

            </svg>
            <div id="dots"></div>
            <div class="preview" id="preview" aria-hidden="true">
                <div class="preview-surface">
                    <article class="wiki-page">
                        <div class="wiki-masthead"><span class="wiki-mark">W</span><span>Wikipedia</span></div>
                        <h1 id="wiki-title"></h1>
                        <div class="wiki-rule"></div>
                        <p class="wiki-subtitle">Aus Wikipedia, der freien Enzyklopädie</p>
                        <img class="wiki-image" id="wiki-image" alt="">
                        <p class="wiki-excerpt" id="wiki-excerpt"></p>
                    </article>
                </div>
            </div>
        </main>
    </div>
    <script>
        (() => {
            'use strict';

            const WIDTH = 1498;
            const HEIGHT = 927;
            const DOT_SPACING = 28;       // Kleiner = dichterer Weg aus Kreisen
            const RANDOM_BATCHES = 4;     // Vier unabhängige Zufallsauswahlen
            const ARTICLES_PER_BATCH = 75;
            const API = 'https://de.wikipedia.org/w/api.php';

            const map = document.getElementById('map');
            const viewport = document.getElementById('viewport');
            const dotsLayer = document.getElementById('dots');
            const preview = document.getElementById('preview');
            const title = document.getElementById('wiki-title');
            const excerpt = document.getElementById('wiki-excerpt');
            const image = document.getElementById('wiki-image');
            const paths = [...document.querySelectorAll('#guides path')];
            const dots = [];
            const summaryCache = new Map();
            const fallbackTitles = [
                'Wikipedia', 'Wissensallmende', 'Internet', 'Öffentlicher Raum',
                'Gemeingut', 'Hypertext', 'Open Access', 'Freie Software',
                'Bibliothek', 'Kartografie', 'Digitales Gemeingut', 'Netzwerk',
                'Offene Daten', 'Wissenschaft', 'Sprache', 'Kommunikation'
            ];
            let activeDot = null;
            let touchDot = null;
            let touchTime = 0;
            let requestSerial = 0;

            // Feste visuelle Streuung: Der Weg bleibt stabil, die Artikel ändern sich bei jedem Laden.
            function seededRandom(seed) {
                return () => {
                    seed |= 0;
                    seed = (seed + 0x6D2B79F5) | 0;
                    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                    t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            }
            const rand = seededRandom(124903);

            function articleURL(article) {
                return article.id
                    ? `https://de.wikipedia.org/?curid=${article.id}`
                    : `https://de.wikipedia.org/wiki/${encodeURIComponent(article.title.replaceAll(' ', '_'))}`;
            }

            function createDots() {
                const fragment = document.createDocumentFragment();

                paths.forEach(path => {
                    const total = path.getTotalLength();
                    for (let distance = 8; distance < total - 5;) {
                        const at = Math.min(total, Math.max(0, distance + (rand() - .5) * 10));
                        const point = path.getPointAtLength(at);
                        const before = path.getPointAtLength(Math.max(0, at - 5));
                        const after = path.getPointAtLength(Math.min(total, at + 5));
                        const dx = after.x - before.x;
                        const dy = after.y - before.y;
                        const magnitude = Math.hypot(dx, dy) || 1;
                        const side = (rand() - .5) * 25;
                        const x = point.x - dy / magnitude * side;
                        const y = point.y + dx / magnitude * side;
                        const diameter = (rand() < .12 ? 38 : 18) + rand() * 23;
                        const article = { title: fallbackTitles[dots.length % fallbackTitles.length] };
                        const dot = document.createElement('a');
                        dot.className = 'article-dot';
                        dot.style.left = `${x / WIDTH * 100}%`;
                        dot.style.top = `${y / HEIGHT * 100}%`;
                        dot.style.width = `${diameter / WIDTH * 100}%`;
                        dot.style.height = `${diameter / HEIGHT * 100}%`;
                        dot.style.setProperty('--alpha', (0.65 + rand() * .25).toFixed(2));
                        dot.dataset.diameter = diameter;
                        dot.article = article;
                        dot.href = articleURL(article);
                        dot.target = '_blank';
                        dot.rel = 'noopener noreferrer';
                        dot.setAttribute('aria-label', `Wikipedia: ${article.title}`);
                        dots.push(dot);
                        fragment.appendChild(dot);
                        distance += DOT_SPACING * (.78 + rand() * .47);
                    }
                });
                dotsLayer.appendChild(fragment);
            }

            async function fetchJSON(params) {
                const url = new URL(API);
                url.search = new URLSearchParams({ action: 'query', format: 'json', formatversion: '2', origin: '*', ...params });
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Wikipedia API: ${response.status}`);
                return response.json();
            }

            async function loadRandomArticles() {
                const calls = Array.from({ length: RANDOM_BATCHES }, () => fetchJSON({
                    list: 'random', rnnamespace: '0', rnfilterredir: 'nonredirects',
                    rnminsize: '500', rnlimit: String(ARTICLES_PER_BATCH)
                }));
                const results = await Promise.allSettled(calls);
                const unique = new Map();
                for (const result of results) {
                    if (result.status !== 'fulfilled') continue;
                    for (const page of result.value.query?.random ?? []) {
                        const id = Number(page.id ?? page.pageid);
                        if (id && page.title) unique.set(id, { id, title: page.title });
                    }
                }
                if (!unique.size) {
                    console.warn('Wikipedia ist gerade nicht erreichbar; die Beispielartikel bleiben aktiv.');
                    return;
                }
                const articles = [...unique.values()];
                for (let i = articles.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [articles[i], articles[j]] = [articles[j], articles[i]];
                }
                dots.forEach((dot, index) => {
                    dot.article = articles[index % articles.length];
                    dot.href = articleURL(dot.article);
                    dot.setAttribute('aria-label', `Wikipedia: ${dot.article.title}`);
                });
                if (activeDot) showArticle(activeDot);
            }

            async function loadSummary(article) {
                const key = article.id ?? article.title;
                if (!summaryCache.has(key)) {
                    const params = {
                        prop: 'extracts|pageimages', exintro: '1', explaintext: '1',
                        exchars: '950', piprop: 'thumbnail', pithumbsize: '300',
                        ...(article.id ? { pageids: String(article.id) } : { titles: article.title })
                    };
                    summaryCache.set(key, fetchJSON(params).then(data => data.query?.pages?.[0] ?? null));
                }
                return summaryCache.get(key);
            }

            async function showArticle(dot) {
                const serial = ++requestSerial;
                const article = dot.article;
                title.textContent = article.title;
                excerpt.textContent = 'Artikelausschnitt wird geladen …';
                image.classList.remove('has-image');
                image.removeAttribute('src');
                try {
                    const page = await loadSummary(article);
                    if (serial !== requestSerial || activeDot !== dot) return;
                    title.textContent = page?.title || article.title;
                    excerpt.textContent = page?.extract?.trim()
                        || 'Für diesen Artikel ist keine Kurzvorschau vorhanden. Klicke auf den Kreis, um ihn auf Wikipedia zu lesen.';
                    if (page?.thumbnail?.source?.startsWith('https://')) {
                        image.src = page.thumbnail.source;
                        image.classList.add('has-image');
                    }
                } catch (error) {
                    if (serial !== requestSerial || activeDot !== dot) return;
                    excerpt.textContent = 'Die Vorschau konnte nicht geladen werden. Klicke auf den Kreis, um den Artikel auf Wikipedia zu öffnen.';
                    console.warn('Wikipedia-Vorschau konnte nicht geladen werden:', error);
                }
            }

            function activate(dot) {
                if (activeDot === dot) return;
                activeDot?.classList.remove('is-active');
                activeDot = dot;
                dot.classList.add('is-active');
                preview.classList.remove('is-visible');
                preview.style.left = dot.style.left;
                preview.style.top = dot.style.top;
                const visibleDiameter = Number(dot.dataset.diameter) * map.clientWidth / WIDTH;
                preview.style.setProperty('--start-scale', Math.max(.07, visibleDiameter / preview.clientWidth).toFixed(3));
                // Ein Reflow lässt auch beim Wechsel zwischen zwei Kreisen die Expansion neu starten.
                void preview.offsetWidth;
                preview.classList.add('is-visible');
                showArticle(dot);
            }

            function deactivate() {
                if (!activeDot) return;
                ++requestSerial;
                activeDot.classList.remove('is-active');
                activeDot = null;
                preview.classList.remove('is-visible');
            }

            function hoveredDot(target) {
                return target instanceof Element ? target.closest('.article-dot') : null;
            }

            map.addEventListener('pointermove', event => {
                if (event.pointerType === 'touch') return;
                const dot = hoveredDot(event.target);
                if (dot) activate(dot);
                else deactivate(); // Private Property: keine Vorschau
            });
            map.addEventListener('pointerleave', event => {
                if (event.pointerType !== 'touch') deactivate();
            });
            dotsLayer.addEventListener('focusin', event => {
                const dot = hoveredDot(event.target);
                if (dot) activate(dot);
            });
            dotsLayer.addEventListener('focusout', event => {
                if (!dotsLayer.contains(event.relatedTarget)) deactivate();
            });
            map.addEventListener('click', event => {
                const dot = hoveredDot(event.target);
                if (!dot) { deactivate(); return; }
                // Auf Touchscreens erst ansehen, beim zweiten Tippen Wikipedia öffnen.
                if (window.matchMedia('(hover: none)').matches) {
                    const now = Date.now();
                    if (touchDot !== dot || now - touchTime > 3500) {
                        event.preventDefault();
                        touchDot = dot;
                        touchTime = now;
                        activate(dot);
                    }
                }
            });
            window.addEventListener('keydown', event => {
                if (event.key === 'Escape') deactivate();
            });

            createDots();
            if (viewport.scrollWidth > viewport.clientWidth) {
                viewport.scrollLeft = (viewport.scrollWidth - viewport.clientWidth) / 2;
            }
            loadRandomArticles();
        })();
    </script>
</body>

</html>
